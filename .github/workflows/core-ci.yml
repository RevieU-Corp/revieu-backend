name: Core Service CI/CD

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/core/**"
      - ".github/workflows/core-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "apps/core/**"
      - ".github/workflows/core-ci.yml"

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  validate:
    name: Validate and Lint
    # 只在 PR 时运行验证，merge 后跳过（因为 PR 已经验证过了）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Source Branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # 如果目标是 main，必须来自 dev
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "dev" ]]; then
            echo "Error: Pull Requests to 'main' must originate from the 'dev' branch."
            exit 1
          fi

          # 如果目标是 dev，不能直接来自 main
          if [[ "$BASE_REF" == "dev" && "$HEAD_REF" == "main" ]]; then
            echo "Error: You cannot merge 'main' into 'dev' via PR."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/core/go.sum

      - name: Download dependencies
        working-directory: apps/core
        run: go mod download

      - name: Verify dependencies
        working-directory: apps/core
        run: go mod verify

      - name: Run go vet
        working-directory: apps/core
        run: go vet ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: apps/core
          args: --timeout=5m

      - name: Check Swagger docs are up to date
        working-directory: apps/core
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          swag init -g cmd/app/main.go -o docs --parseInternal --parseDependency
          if [ -n "$(git diff --name-only docs/)" ]; then
            echo "Error: Swagger docs are out of date. Please run 'swag init -g cmd/app/main.go -o docs --parseInternal --parseDependency' and commit the changes."
            git diff docs/
            exit 1
          fi

      - name: Run tests
        working-directory: apps/core
        env:
          CGO_ENABLED: 1
        run: go test -v -race -coverprofile=coverage.out ./...


  build-and-push:
    name: Build and Push Image
    # 只有推送到 main 或 dev 分支时才触发
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        run: |
          echo "IMAGE_NAME_LOWER=$(echo ${{ github.repository_owner }}/revieu-core-api-go | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/core
          file: ./apps/core/build/package/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Create infra promotion pull request
        env:
          GH_TOKEN: ${{ secrets.INFRA_UPDATE_TOKEN }}
          INFRA_REPOSITORY: LosFurina/infra
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          WORKLOAD_FILE: ${{ github.ref_name == 'main' && 'workloads/revieu-prod/core-api.yaml' || 'workloads/revieu-dev/core-api.yaml' }}
          PROMOTION_BRANCH: automation/revieu-core-api-${{ github.ref_name }}-${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "INFRA_UPDATE_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "Docker build did not return an image digest."
            exit 1
          fi

          rm -rf infra
          git clone --branch main "https://x-access-token:${GH_TOKEN}@github.com/${INFRA_REPOSITORY}.git" infra
          cd infra
          git checkout -b "$PROMOTION_BRANCH"

          python3 - "$WORKLOAD_FILE" "$IMAGE_TAG" "$IMAGE_DIGEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          image_tag = sys.argv[2]
          digest = sys.argv[3]
          text = path.read_text()
          pattern = r"(ghcr\.io/revieu-corp/revieu-core-api-go:)[^@\s]+@sha256:[a-f0-9]+"
          replacement = rf"\g<1>{image_tag}@{digest}"
          updated, count = re.subn(pattern, replacement, text)
          if count != 1:
              raise SystemExit(f"expected one core API image reference in {path}, found {count}")
          path.write_text(updated)
          PY

          if git diff --quiet -- "$WORKLOAD_FILE"; then
            echo "Infra already references $IMAGE_TAG@$IMAGE_DIGEST."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WORKLOAD_FILE"
          git commit -m "chore(revieu-${{ github.ref_name }}): promote core api image"
          git push origin "$PROMOTION_BRANCH"

          gh pr create \
            --repo "$INFRA_REPOSITORY" \
            --base main \
            --head "$PROMOTION_BRANCH" \
            --title "chore(revieu-${{ github.ref_name }}): promote core api image" \
            --body "Promote core API image digest from commit ${{ github.sha }}. CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not set, skipping notification."
            exit 0
          fi

          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) COLOR=3066993 ;; # Green
            failure) COLOR=15158332 ;; # Red
            cancelled) COLOR=9807270 ;; # Grey
            *) COLOR=0 ;;
          esac

          MESSAGE="Build and Push of **${{ github.repository }}** (core-service, ${{ github.ref_name }}) was a **$STATUS**."

          curl -X POST -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"CI/CD Notification\",
                \"description\": \"$MESSAGE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"Commit\", \"value\": \"[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\", \"inline\": false},
                  {\"name\": \"Tags\", \"value\": \"\`\`\`${{ steps.meta.outputs.tags }}\`\`\`\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"RevieU CI/CD\"}
              }]
            }" \
            $DISCORD_WEBHOOK
